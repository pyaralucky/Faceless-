name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faceless
          POSTGRES_PASSWORD: faceless
          POSTGRES_DB: faceless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faceless" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: postgresql+asyncpg://faceless:faceless@localhost:5432/faceless_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://faceless:faceless@localhost:5432/faceless_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose build
